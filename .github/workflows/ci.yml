name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (format, vet, tests with Postgres and -race, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: clockwork_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CLOCKWORK_TEST_DATABASE_URL: postgres://postgres:dev@localhost:5432/clockwork_test?sslmode=disable
      # Minimum statement coverage of internal/ (docs/DEFINITION_OF_DONE.md, point 16).
      MIN_COVERAGE: "70"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests
        # -p 1: the integration tests of several packages share one database.
        run: go test -race -p 1 -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Coverage of internal/: ${total}% (minimum ${MIN_COVERAGE}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t + 0 < m + 0) }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  web:
    name: Web UI (tests, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg "VERSION=${GITHUB_SHA::12}" -t clockwork:ci .
      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id clockwork:ci -u)
          echo "uid=$uid"
          [ "$uid" != "0" ]
